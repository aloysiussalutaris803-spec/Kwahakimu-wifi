<style>
:root{--g:#168B45;--gd:#08652F;--ga:#32B768;--bg:#F5F8F5;--card:#fff;--tx:#17231B;--mu:#5b6b60;--bd:#DCE7DE;--hd:rgba(255,255,255,.93);--er:#B3261E;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1510;--card:#15211a;--tx:#E8F2EA;--mu:#9bb0a1;--bd:#25382b;--hd:rgba(13,21,16,.93);--er:#FF8A80}}
:root[data-theme="dark"]{--bg:#0d1510;--card:#15211a;--tx:#E8F2EA;--mu:#9bb0a1;--bd:#25382b;--hd:rgba(13,21,16,.93);--er:#FF8A80}
*,*::before,*::after{box-sizing:inherit}html{scroll-padding-top:80px}
body{margin:0;font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:10}
a{color:var(--g)}h1,h2,h3{line-height:1.15;margin:0 0 .5em}h1{font-size:clamp(2rem,6vw,3.1rem);letter-spacing:-.02em}h2{font-size:clamp(1.5rem,4vw,2.1rem)}p{margin:0 0 1em}.mu{color:var(--mu)}.er{color:var(--er)}
.w{max-width:1100px;margin:auto;padding:0 18px}.sec{padding:44px 0}.c{text-align:center}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--hd);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
.nb{display:flex;align-items:center;gap:10px;min-height:64px;position:relative}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--g);text-decoration:none;font-size:1.15rem}
nav{display:flex;gap:2px;margin-left:auto;align-items:center}nav a{padding:8px 11px;border-radius:999px;text-decoration:none;color:var(--tx);font-size:.93rem}nav a.on,nav a:hover{background:rgba(22,139,69,.13);color:var(--g)}nav a.btn{color:#fff;margin-left:6px}
.burger{display:none;margin-left:auto;background:none;border:1px solid var(--bd);border-radius:10px;color:var(--tx);font-size:1.4rem;padding:4px 11px;cursor:pointer}
.btn{display:inline-block;border:0;border-radius:999px;background:var(--g);color:#fff;font:inherit;font-weight:700;padding:11px 22px;cursor:pointer;text-decoration:none;box-shadow:0 4px 14px rgba(22,139,69,.3)}.btn:hover{background:var(--gd)}
.btn.o{background:transparent;color:var(--g);border:2px solid var(--g);box-shadow:none}.btn.s{padding:6px 14px;font-size:.88rem}.btn.x{background:var(--er)}.btn:focus-visible,a:focus-visible,button:focus-visible{outline:3px solid var(--ga);outline-offset:2px}
.gr{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(235px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:20px;box-shadow:0 6px 20px rgba(8,101,47,.07)}
.pk{display:flex;flex-direction:column}.pk ul{padding-left:18px;margin:0 0 16px;flex:1}.pr{font-size:1.8rem;font-weight:800;color:var(--g)}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center}.lead{font-size:1.1rem}.art{width:100%;max-width:380px;margin:auto}
.ben{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:6px}.ben li::before{content:"\2713";color:var(--g);font-weight:800;margin-right:8px}
.stp{counter-reset:s}.stp .card::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--g);color:#fff;font-weight:800;margin-bottom:10px}
details{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 16px;margin-bottom:10px}summary{cursor:pointer;font-weight:600}
input,select,textarea{width:100%;padding:11px 13px;border:1px solid var(--bd);border-radius:12px;font:inherit;background:var(--card);color:var(--tx)}input:focus,select:focus,textarea:focus{outline:2px solid var(--ga)}
label{display:block;font-size:.88rem;color:var(--mu);margin:0 0 12px}label.ck{display:flex;gap:8px;align-items:center}label.ck input{width:auto}
.ch{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.78rem;background:rgba(22,139,69,.14);color:var(--g)}.ch.x{background:rgba(179,38,30,.15);color:var(--er)}.ch.m{background:rgba(120,130,120,.2);color:var(--mu)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}.ov[hidden]{display:none}
.mb{background:var(--card);border-radius:20px;padding:24px;max-width:440px;width:100%;max-height:90dvh;overflow:auto;position:relative}.mb .xx{position:absolute;right:12px;top:8px;background:none;border:0;font-size:1.6rem;color:var(--mu);cursor:pointer}
.sb{border:1px dashed var(--g);border-radius:12px;padding:10px 12px;margin:12px 0;font-size:.9rem}.sbn{background:var(--gd);color:#fff;text-align:center;font-size:.82rem;padding:5px 10px}
.tb{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.88rem}th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}.tabs button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:7px 14px;font:inherit;cursor:pointer}.tabs button.on{background:var(--g);color:#fff;border-color:var(--g)}
.fg{display:grid;gap:12px 24px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.ed{display:grid;gap:0 12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.big{font-size:2rem;font-weight:800;color:var(--g)}
footer{background:var(--card);border-top:1px solid var(--bd);padding:32px 0 20px;font-size:.92rem}footer a{display:block;text-decoration:none;margin-top:4px}
body.pt nav,body.pt .burger,body.pt footer{display:none}
@media(max-width:860px){.hero{grid-template-columns:1fr}.burger{display:block}nav{display:none;position:absolute;left:0;right:0;top:100%;flex-direction:column;align-items:stretch;background:var(--card);padding:10px 18px 16px;border-bottom:1px solid var(--bd)}nav.open{display:flex}nav a.btn{text-align:center;margin:6px 0 0}}
</style>
</head>
<body>
<div class="sbn" id="sbn" hidden>Sandbox mode: payments and network access are simulated. No real money is charged.</div>
<header><div class="w nb"><a class="logo" href="#/" id="lg"></a><button class="burger" id="bg" aria-label="Menu" aria-expanded="false">&#9776;</button>
<nav id="nv"><a href="#/">Home</a><a href="#/packages">WiFi Packages</a><a href="#/how">How It Works</a><a href="#/coverage">Coverage</a><a href="#/about">About Us</a><a href="#/help">Help &amp; Support</a><a href="#/account" id="na">Login / My Account</a><a class="btn" href="#/portal">Connect to WiFi</a></nav></div></header>
<main id="app"></main>
<footer id="ft"></footer>
<div class="ov" id="ov" hidden><div class="mb" role="dialog" aria-modal="true"><button class="xx" onclick="closeM()" aria-label="Close">&times;</button><div id="md"></div></div></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const K='kwifi1',TZ=n=>'TZS '+Number(n).toLocaleString('en-US'),uid=()=>Math.random().toString(36).slice(2,8),V=h=>{$('#app').innerHTML=h};
const PV={mpesa:'M-Pesa',airtel:'Airtel Money',mixx:'Mixx by Yas',halo:'HaloPesa'};
const LG='<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#168B45" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M2 9a15 15 0 0 1 20 0"/><path d="M5.5 12.5a10 10 0 0 1 13 0"/><path d="M9 16a5 5 0 0 1 6 0"/><circle cx="12" cy="19.5" r="1" fill="#168B45"/></svg>';
const ART='<svg class="art" viewBox="0 0 320 260" role="img" aria-label="People connected to WiFi"><circle cx="160" cy="125" r="112" fill="rgba(22,139,69,.1)"/><g fill="none" stroke="#168B45" stroke-width="10" stroke-linecap="round"><path d="M80 100a110 110 0 0 1 160 0"/><path d="M108 128a70 70 0 0 1 104 0"/><path d="M134 154a32 32 0 0 1 52 0"/></g><circle cx="160" cy="182" r="9" fill="#168B45"/><rect x="38" y="168" width="72" height="62" rx="10" fill="#08652F"/><rect x="216" y="146" width="62" height="102" rx="12" fill="#32B768"/></svg>';
const D=()=>({cfg:{sandbox:true,phone:'',email:'',social:'',pin:'admin',ctrl:'none',prov:{mpesa:1,airtel:1,mixx:1,halo:1}},
pk:[{id:'d',name:'Daily Access',price:1000,hrs:24,speed:'',data:'',dev:1,on:true,desc:'Ideal for everyday browsing.'},{id:'w',name:'Weekly Access',price:5000,hrs:168,speed:'',data:'',dev:1,on:true,desc:'Ideal for regular internet users.'},{id:'m',name:'Monthly Access',price:20000,hrs:720,speed:'',data:'',dev:1,on:true,desc:'Ideal for frequent users.'},{id:'h',name:'Hourly Access',price:300,hrs:1,speed:'',data:'',dev:1,on:true,desc:'Ideal for quick browsing.'}],
loc:[{id:'l1',name:'Kwahakimu Street – Main Hotspot',area:'Kwahakimu Street',status:'',how:'Connect to the Kwahakimu WiFi network, then open any website to reach the login page.'}],
users:[],tx:[],ses:[],tk:[],me:null});
let S=(()=>{try{return Object.assign(D(),JSON.parse(localStorage.getItem(K)))}catch(e){return D()}})(),tm,ad=false,at='ov',pend=null,fails=0,lock=0;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const act=()=>S.pk.filter(p=>p.on),ph=v=>{const m=String(v).replace(/[\s-]/g,'').match(/^(?:\+?255|0)([67]\d{8})$/);return m?'255'+m[1]:null},loc0=n=>'0'+String(n).slice(3);
const dur=h=>h%24==0?(h/24)+(h==24?' day':' days'):h+(h==1?' hour':' hours');
const left=ms=>{ms=Math.max(0,ms);const s=ms/1e3|0;return Math.floor(s/86400)+'d '+String(Math.floor(s%86400/3600)).padStart(2,'0')+':'+String(Math.floor(s%3600/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const dt=t=>new Date(t).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'});
const contact=()=>[S.cfg.phone&&`Phone: ${E(S.cfg.phone)}`,S.cfg.email&&`Email: ${E(S.cfg.email)}`].filter(Boolean).join('<br>')||'Use the support form on the Help page.';
/* ---------- Backend adapter: replace with fetch() calls to your secure server ---------- */
function grant(t){ // Integration point: call hotspot controller / RADIUS / voucher API here after VERIFIED payment.
  const now=Date.now(),a=S.ses.filter(s=>s.phone==t.phone&&s.end>now).sort((x,y)=>y.end-x.end)[0],st=a?a.end:now;
  S.ses.push({id:uid(),phone:t.phone,ref:t.ref,name:t.pk.name,dev:t.pk.dev,loc:t.loc,start:st,end:st+t.pk.hrs*36e5})}
function settle(w){ // Webhook handler: idempotent, verifies amount/currency/reference/status
  const t=S.tx.find(x=>x.ref==w.ref);if(!t||t.status!='pending')return;
  if(Date.now()>t.exp)t.status='expired';else if(w.status!='SUCCESS')t.status='failed';
  else if(w.amount!==t.pk.price||w.cur!=='TZS'){t.status='failed';t.note='Amount mismatch'}else{t.status='success';grant(t)}save()}
async function hs(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('kw:'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return btoa(s)}}
/* ---------- UI helpers ---------- */
function modal(h){$('#md').innerHTML=h;$('#ov').hidden=false}function closeM(){$('#ov').hidden=true}
const pkCard=(p,l)=>`<article class="card pk"><h3>${E(p.name)}</h3><div class="pr">${TZ(p.price)}</div><p class="mu">Valid for ${dur(p.hrs)}</p><ul><li>Up to ${p.dev} device${p.dev>1?'s':''}</li>${p.speed?`<li>Speed: ${E(p.speed)}</li>`:''}${p.data?`<li>Data: ${E(p.data)}</li>`:''}${p.desc?`<li>${E(p.desc)}</li>`:''}</ul><button class="btn" onclick="buy('${p.id}','${l||''}')">Buy Package</button></article>`;
const pkSec=()=>`<section class="w sec" id="pk"><h2 class="c">WiFi Packages</h2><p class="c mu">Choose the access that fits you. Pay with mobile money and connect.</p><div class="gr">${act().map(p=>pkCard(p)).join('')||'<p class="c mu">Packages are being set up. Please check back soon.</p>'}</div></section>`;
const howSec=()=>`<section class="w sec"><h2 class="c">How It Works</h2><div class="gr stp">${['Connect to the Kwahakimu WiFi hotspot.','Open the WiFi login portal.','Choose a package and pay with mobile money.','Receive access and start browsing.'].map(s=>`<div class="card">${s}</div>`).join('')}</div><p class="c mu" style="margin-top:16px">Access activates automatically after your payment is verified. You do not need to do anything else.</p></section>`;
const stc=l=>l.status=='online'?'<span class="ch">Online</span>':l.status=='offline'?'<span class="ch x">Offline</span>':'<span class="ch m">Status not monitored</span>';
const covList=q=>{q=(q||'').toLowerCase();return S.loc.filter(l=>(l.name+' '+l.area).toLowerCase().includes(q)).map(l=>`<div class="card"><h3>${E(l.name)}</h3><p class="mu">${E(l.area)}</p><p>${stc(l)}</p><p>${E(l.how)}</p><a class="btn s" href="#/portal/${l.id}">Open login portal</a></div>`).join('')||'<p class="mu">No matching locations.</p>'};
const covSec=n=>`<section class="w sec"><h2 class="c">Coverage</h2><div class="gr">${S.loc.slice(0,n).map(l=>`<div class="card"><h3>${E(l.name)}</h3><p class="mu">${E(l.area)}</p>${stc(l)}</div>`).join('')}</div><p class="c" style="margin-top:16px"><a href="#/coverage">See all locations</a></p></section>`;
const benSec=()=>`<section class="w sec"><h2 class="c">Why Kwahakimu WiFi</h2><div class="gr">${[['Affordable internet','Prices set for everyday customers.'],['Flexible packages','Hourly, daily, weekly and monthly options.'],['Mobile money','Pay from your phone, no cash needed.'],['Secure accounts','Protected login and payment records.'],['Multiple locations','Use your package at participating hotspots.'],['Responsive support','Get help through the support page.']].map(b=>`<div class="card"><h3>${b[0]}</h3><p class="mu" style="margin:0">${b[1]}</p></div>`).join('')}</div></section>`;
const faqSec=()=>{const md=Math.max(1,...act().map(p=>p.dev));return`<section class="w sec" style="max-width:800px"><h2 class="c">Frequently Asked Questions</h2>${[['How do I connect to Kwahakimu WiFi?','Join the Kwahakimu WiFi network on your phone or laptop. The login portal opens automatically, or open any website to reach it.'],['How can I pay for internet access?','Choose a package, enter your mobile money number and approve the request on your phone. Enabled providers: '+Object.keys(PV).filter(k=>S.cfg.prov[k]).map(k=>PV[k]).join(', ')+'.'],['What happens after my package expires?','Your access stops when the validity period ends. Buy another package to reconnect. A new package bought while one is active is added to the end of it.'],['Can I use my package at another hotspot?','Yes, at participating hotspots listed on the Coverage page. Your package belongs to your phone number.'],['Can I connect multiple devices?','Each package shows its device limit (up to '+md+' device'+(md>1?'s':'')+' at present).'],['My payment succeeded but I cannot browse. What now?','Wait a minute for confirmation, reconnect to the WiFi, then contact support with your payment reference from My Account.'],['How do I contact customer support?','Use the form on the Help &amp; Support page.']].map(f=>`<details><summary>${f[0]}</summary><p class="mu" style="margin:.6em 0 0">${f[1]}</p></details>`).join('')}</section>`};
/* ---------- Pages ---------- */
function home(){V(`<section class="w sec hero"><div><h1>Reliable WiFi Across Kwahakimu Street and Beyond</h1><p class="lead mu">Stay connected with affordable, high-speed internet. Choose your package, make a secure payment, and start browsing in minutes.</p><p><a class="btn" href="#/portal">Get Connected</a> <a class="btn o" href="#/packages">View WiFi Packages</a></p><ul class="ben"><li>Affordable internet packages</li><li>Fast and reliable connectivity</li><li>Convenient digital payments</li></ul></div>${ART}</section>${pkSec()}${howSec()}${covSec(3)}${benSec()}${faqSec()}`)}
const pkgs=()=>V(pkSec()+howSec());
const how=()=>V(howSec()+faqSec());
function cov(){V(`<section class="w sec"><h1>Coverage</h1><p class="mu">Search for a hotspot near you. Status is shown only when monitoring data is available.</p><label>Search by location or hotspot name<input id="cq" oninput="$('#cl').innerHTML=covList(this.value)" placeholder="e.g. Kwahakimu"></label><div class="gr" id="cl">${covList('')}</div></section>`)}
const about=()=>V(`<section class="w sec" style="max-width:760px"><h1>About Us</h1><p>Kwahakimu WiFi brings affordable, convenient internet to Kwahakimu Street and surrounding areas. Customers choose a package, pay with mobile money and get online without cables or contracts.</p><p class="mu">Fast. Affordable. Connected Everywhere.</p><a class="btn" href="#/packages">View WiFi Packages</a></section>`);
function help(){V(`<section class="w sec" style="max-width:800px"><h1>Help &amp; Support</h1><div class="card" style="margin-bottom:20px"><h3>Contact us</h3><p>${contact()}</p><form onsubmit="return tk(event)"><label>Your name<input id="tn" required></label><label>Phone number<input id="tp" inputmode="tel" required></label><label>How can we help?<textarea id="tm" rows="4" required></textarea></label><p class="er" id="te"></p><button class="btn">Send message</button></form></div></section>${faqSec()}`)}
function tk(e){e.preventDefault();const n=ph($('#tp').value);if(!n){$('#te').textContent='Enter a valid Tanzanian phone number.';return false}S.tk.unshift({id:uid(),name:$('#tn').value.slice(0,80),phone:n,msg:$('#tm').value.slice(0,1000),at:Date.now()});save();$('#te').textContent='';e.target.innerHTML='<p><b>Thank you.</b> Your message was received and we will contact you.</p>';return false}
const LEG={terms:['Terms and Conditions','Access is provided for lawful personal use. A package is valid for the period shown when purchased and ends automatically at expiry. Packages are tied to the phone number used at purchase. Fair-use and device limits shown on each package apply. Kwahakimu WiFi may suspend access for abuse or illegal activity.'],privacy:['Privacy Policy','We collect your phone number, payment references and session records to provide and bill for internet access and to give support. We do not sell personal data. You may ask us to correct or delete your account data through the Help page.'],refund:['Refund Policy','If a payment was confirmed but access was not activated, contact support with your payment reference. Verified failures are activated, credited or refunded. Used packages are not refundable.']};
function legal(a){const l=LEG[a]||LEG.terms;V(`<section class="w sec" style="max-width:760px"><h1>${l[0]}</h1><p>${l[1]}</p><p class="mu">Contact: ${contact()}</p></section>`)}
function portal(a){const l=S.loc.find(x=>x.id==a)||S.loc[0]||{id:'',name:'Kwahakimu WiFi'},s=S.me&&S.ses.filter(x=>x.phone==S.me&&x.end>Date.now()).sort((x,y)=>y.end-x.end)[0];
V(`<section class="w sec" style="max-width:640px"><div class="card"><h1>Welcome to Kwahakimu WiFi</h1><p class="mu">Hotspot: <b>${E(l.name)}</b></p>${s?`<div class="sb"><b>You are online.</b> ${E(s.name)} is active until ${dt(s.end)}.</div>`:''}<h2>Choose a package</h2><div class="gr" style="grid-template-columns:1fr">${act().map(p=>pkCard(p,l.id)).join('')||'<p class="mu">No packages available right now.</p>'}</div><p style="margin-top:16px"><a href="#/account">Existing customer? Log in</a> &middot; <a href="#/legal/terms">Terms of service</a></p><p class="mu">Support: ${contact()}</p></div></section>`)}
/* ---------- Payment flow ---------- */
function buy(id,loc){const p=S.pk.find(x=>x.id==id),pv=Object.keys(PV).filter(k=>S.cfg.prov[k]);if(!pv.length)return modal('<h2>Payments unavailable</h2><p>No payment provider is enabled right now.</p>');
modal(`<h2>${E(p.name)}</h2><p class="mu">${TZ(p.price)} &middot; ${dur(p.hrs)} &middot; ${p.dev} device${p.dev>1?'s':''}</p><label>Mobile money number<input id="bp" inputmode="tel" value="${S.me?loc0(S.me):''}" placeholder="0712 345 678"></label><label>Pay with<select id="bv">${pv.map(k=>`<option value="${k}">${PV[k]}</option>`).join('')}</select></label><p class="er" id="be"></p><button class="btn" onclick="pay('${id}','${loc||''}')">Pay ${TZ(p.price)}</button>`)}
function pay(id,loc){const n=ph($('#bp').value);if(!n)return $('#be').textContent='Enter a valid Tanzanian mobile number.';
const p=S.pk.find(x=>x.id==id),t={ref:'KW'+Date.now().toString(36).toUpperCase()+uid().toUpperCase().slice(0,3),phone:n,prov:$('#bv').value,pk:{id:p.id,name:p.name,price:p.price,hrs:p.hrs,dev:p.dev},loc,status:'pending',at:Date.now(),exp:Date.now()+6e5,cur:'TZS'};S.tx.unshift(t);save();txView(t.ref)}
function cb(ref,ok){const t=S.tx.find(x=>x.ref==ref);settle({ref,amount:t.pk.price,cur:'TZS',status:ok?'SUCCESS':'FAILED'});txView(ref)}
function rcpt(t){const s=S.ses.find(x=>x.ref==t.ref);return`<div class="sb"><b>Receipt</b><br>Reference: ${t.ref}<br>Package: ${E(t.pk.name)}<br>Amount: ${TZ(t.pk.price)}<br>Paid via: ${PV[t.prov]} (${t.phone})<br>Date: ${dt(t.at)}${s?`<br>Valid until: <b>${dt(s.end)}</b>`:''}</div><p>You are connected. Open any website to start browsing.</p>`}
function txView(ref){const t=S.tx.find(x=>x.ref==ref);if(t.status=='pending'&&Date.now()>t.exp){t.status='expired';save()}const s=t.status;
modal(`<h2>${s=='success'?'Payment confirmed':s=='pending'?'Approve on your phone':s=='failed'?'Payment failed':'Request expired'}</h2><p class="mu">Ref ${t.ref} &middot; ${TZ(t.pk.price)} &middot; ${PV[t.prov]}</p>`+
(s=='pending'?`<p>A payment request was sent to ${loc0(t.phone)}. Enter your PIN on your phone to approve. Access activates automatically once the provider confirms.</p>`+(S.cfg.sandbox?`<div class="sb"><b>Sandbox:</b> simulate the provider callback.<br><br><button class="btn s" onclick="cb('${ref}',1)">Customer approved</button> <button class="btn s o" onclick="cb('${ref}',0)">Customer declined</button></div>`:'<p class="mu">Waiting for the provider\'s confirmation. Please do not pay twice.</p>'):'')+
(s=='success'?rcpt(t):'')+(s=='failed'||s=='expired'?`<p class="er">${t.note||(s=='failed'?'The payment was declined or cancelled.':'The payment request expired.')} No access was activated.</p><button class="btn" onclick="buy('${t.pk.id}','${t.loc}')">Try again</button>`:''));}
/* ---------- Accounts ---------- */
function authV(m,msg){V(`<section class="w sec" style="max-width:440px"><div class="card"><div class="tabs"><button class="${m=='l'?'on':''}" onclick="authV('l')">Login</button><button class="${m=='r'?'on':''}" onclick="authV('r')">Register</button></div>${m=='o'?`<h2>Verify your phone</h2><p class="mu">Enter the 6-digit code sent by SMS.</p>${S.cfg.sandbox?`<div class="sb">Sandbox code: <b>${pend.otp}</b></div>`:''}<label>Code<input id="ac" inputmode="numeric" maxlength="6"></label><p class="er">${msg||''}</p><button class="btn" onclick="otp()">Verify</button>`:`<h2>${m=='l'?'Welcome back':'Create account'}</h2><label>Phone number<input id="ap" inputmode="tel" placeholder="0712 345 678"></label><label>Password${m=='r'?' (min 8 characters)':''}<input id="aw" type="password" autocomplete="${m=='l'?'current-password':'new-password'}"></label><p class="er">${msg||''}</p><button class="btn" onclick="${m=='l'?'login()':'reg()'}">${m=='l'?'Log in':'Register'}</button>`}</div></section>`)}
async function login(){if(Date.now()<lock)return authV('l','Too many attempts. Try again in a minute.');const n=ph($('#ap').value),u=n&&S.users.find(x=>x.phone==n);
if(u&&u.h==await hs($('#aw').value)){fails=0;S.me=n;save();return route()}if(++fails>=5){lock=Date.now()+6e4;fails=0}authV('l','Incorrect phone number or password.')}
async function reg(){const n=ph($('#ap').value),w=$('#aw').value;if(!n)return authV('r','Enter a valid Tanzanian phone number.');if(w.length<8)return authV('r','Password must be at least 8 characters.');if(S.users.find(x=>x.phone==n))return authV('r','This number is already registered. Please log in.');
pend={n,h:await hs(w),otp:String(100000+Math.random()*9e5|0)};authV('o')}
function otp(){if($('#ac').value.trim()!=pend.otp)return authV('o','Incorrect code.');S.users.push({phone:pend.n,h:pend.h});S.me=pend.n;pend=null;save();route()}
function acct(){if(!S.me)return authV('l');const n=S.me,now=Date.now(),ss=S.ses.filter(x=>x.phone==n).sort((a,b)=>b.end-a.end),on=ss.filter(x=>x.end>now),until=on[0]&&on[0].end,tx=S.tx.filter(x=>x.phone==n);
V(`<section class="w sec"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><h1>My Account</h1><div><span class="mu">${loc0(n)}</span> <button class="btn s o" onclick="S.me=null;save();route()">Log out</button></div></div>
<div class="card" style="margin-bottom:18px"><h3>Active package</h3>${on.length?`<p>${E(on[0].name)} &middot; ends ${dt(until)}</p><div class="big" id="cd"></div><p class="mu">remaining</p>`:'<p class="mu">You have no active package.</p>'}</div>
<h2>Buy or renew</h2><div class="gr" style="margin-bottom:24px">${act().map(p=>pkCard(p)).join('')}</div>
<div class="gr"><div class="card"><h3>Connected devices / sessions</h3>${on.length?on.map(s=>`<p>${E(s.name)} (up to ${s.dev} device${s.dev>1?'s':''})<br><span class="mu">until ${dt(s.end)}</span> <button class="btn s x" onclick="endS('${s.id}')">End session</button></p>`).join(''):'<p class="mu">No active sessions.</p>'}</div><div class="card"><h3>Support</h3><p>${contact()}</p><a class="btn s" href="#/help">Contact support</a></div></div>
<h2 style="margin-top:24px">Transactions</h2><div class="card tb"><table><tr><th>Date</th><th>Reference</th><th>Package</th><th>Amount</th><th>Status</th><th></th></tr>${tx.map(t=>`<tr><td>${dt(t.at)}</td><td>${t.ref}</td><td>${E(t.pk.name)}</td><td>${TZ(t.pk.price)}</td><td>${t.refunded?'refunded':t.status}</td><td><button class="btn s o" onclick="txView('${t.ref}')">View</button></td></tr>`).join('')||'<tr><td colspan="6" class="mu">No transactions yet.</td></tr>'}</table></div></section>`);
if(until){const f=()=>{const e=$('#cd');if(!e)return clearInterval(tm);if(until<=Date.now()){clearInterval(tm);return acct()}e.textContent=left(until-Date.now())};f();tm=setInterval(f,1e3)}}
function endS(id){const s=S.ses.find(x=>x.id==id);if(s)s.end=Date.now();save();acct()}
/* ---------- Admin ---------- */
const BL={pk:()=>({id:uid(),name:'New package',price:1000,hrs:24,speed:'',data:'',dev:1,on:false,desc:''}),loc:()=>({id:uid(),name:'New hotspot',area:'',status:'',how:'Connect to Kwahakimu WiFi and open the login page.'})};
const up=(k,i,f,v)=>{S[k][i][f]=v;save()},upc=(f,v)=>{S.cfg[f]=v;save();foot();sbn()},upp=(k,v)=>{S.cfg.prov[k]=v?1:0;save()};
const fi=(k,i,f,l,t)=>{const v=S[k][i][f];return t=='b'?`<label class="ck"><input type="checkbox" ${v?'checked':''} onchange="up('${k}',${i},'${f}',this.checked)"> ${l}</label>`:`<label>${l}<input ${t=='n'?'type="number" min="0"':''} value="${E(v)}" onchange="up('${k}',${i},'${f}',${t=='n'?'+this.value':'this.value'})"></label>`};
function adTab(t){at=t;admin()}
function admin(){if(!ad)return V(`<section class="w sec" style="max-width:400px"><div class="card"><h2>Admin sign in</h2><label>Admin PIN<input id="pin" type="password"></label>${S.cfg.sandbox?'<p class="mu">Sandbox PIN: admin</p>':''}<p class="er" id="pe"></p><button class="btn" onclick="if($('#pin').value==S.cfg.pin){ad=true;admin()}else $('#pe').textContent='Incorrect PIN.'">Sign in</button><p class="mu" style="margin-top:12px;font-size:.85rem">Demo login. Replace with server-side admin authentication before going live.</p></div></section>`);
const ok=S.tx.filter(t=>t.status=='success'&&!t.refunded),now=Date.now(),T={ov:'Overview',pk:'Packages',loc:'Locations',tx:'Transactions',tk:'Support',st:'Settings'};let b='';
if(at=='ov')b=`<div class="gr">${[['Revenue',TZ(ok.reduce((a,t)=>a+t.pk.price,0))],['Successful payments',ok.length],['Pending',S.tx.filter(t=>t.status=='pending').length],['Active sessions',S.ses.filter(s=>s.end>now).length],['Customers',S.users.length],['Open messages',S.tk.length]].map(c=>`<div class="card"><div class="mu">${c[0]}</div><div class="big">${c[1]}</div></div>`).join('')}</div>`;
if(at=='pk')b=S.pk.map((p,i)=>`<div class="card" style="margin-bottom:12px"><div class="ed">${fi('pk',i,'name','Name')}${fi('pk',i,'price','Price (TZS)','n')}${fi('pk',i,'hrs','Duration (hours)','n')}${fi('pk',i,'dev','Device limit','n')}${fi('pk',i,'speed','Speed (blank = not shown)')}${fi('pk',i,'data','Data allowance (blank = not shown)')}${fi('pk',i,'desc','Description')}${fi('pk',i,'on','Available to customers','b')}</div><button class="btn s x" onclick="S.pk.splice(${i},1);save();admin()">Delete</button></div>`).join('')+'<button class="btn" onclick="S.pk.push(BL.pk());save();admin()">Add package</button>';
if(at=='loc')b=S.loc.map((l,i)=>`<div class="card" style="margin-bottom:12px"><div class="ed">${fi('loc',i,'name','Hotspot name')}${fi('loc',i,'area','Street / area')}<label>Status<select onchange="up('loc',${i},'status',this.value)">${[['','Not monitored'],['online','Online'],['offline','Offline']].map(o=>`<option value="${o[0]}" ${l.status==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></label>${fi('loc',i,'how','Connection instructions')}</div><button class="btn s x" onclick="S.loc.splice(${i},1);save();admin()">Delete</button></div>`).join('')+'<button class="btn" onclick="S.loc.push(BL.loc());save();admin()">Add location</button>';
if(at=='tx'){const c={};S.tx.forEach(t=>c[t.status]=(c[t.status]||0)+1);b=`<p class="mu">Reconciliation: ${Object.keys(c).map(k=>k+' '+c[k]).join(' &middot; ')||'no transactions'}. Compare successful totals against your provider statements.</p><div class="card tb"><table><tr><th>Date</th><th>Ref</th><th>Phone</th><th>Package</th><th>Amount</th><th>Provider</th><th>Status</th><th>Actions</th></tr>${S.tx.map(t=>`<tr><td>${dt(t.at)}</td><td>${t.ref}</td><td>${loc0(t.phone)}</td><td>${E(t.pk.name)}</td><td>${TZ(t.pk.price)}</td><td>${PV[t.prov]}</td><td>${t.refunded?'refunded':t.status}</td><td>${t.status=='success'&&!t.refunded?`<button class="btn s x" onclick="rf('${t.ref}')">Record refund</button>`:''}${t.status=='pending'||t.status=='expired'?`<button class="btn s o" onclick="mk('${t.ref}')">Mark paid (verified)</button>`:''}</td></tr>`).join('')||'<tr><td colspan="8" class="mu">No transactions.</td></tr>'}</table></div>`}
if(at=='tk')b=S.tk.map(t=>`<div class="card" style="margin-bottom:10px"><b>${E(t.name)}</b> &middot; ${loc0(t.phone)} &middot; <span class="mu">${dt(t.at)}</span><p style="margin:.5em 0">${E(t.msg)}</p><button class="btn s o" onclick="S.tk=S.tk.filter(x=>x.id!='${t.id}');save();admin()">Resolve</button></div>`).join('')||'<p class="mu">No messages.</p>';
if(at=='st')b=`<div class="card"><div class="ed"><label>Support phone<input value="${E(S.cfg.phone)}" onchange="upc('phone',this.value)"></label><label>Support email<input value="${E(S.cfg.email)}" onchange="upc('email',this.value)"></label><label>Social media link<input value="${E(S.cfg.social)}" onchange="upc('social',this.value)"></label><label>Admin PIN<input value="${E(S.cfg.pin)}" onchange="upc('pin',this.value)"></label></div>
<label class="ck"><input type="checkbox" ${S.cfg.sandbox?'checked':''} onchange="upc('sandbox',this.checked);admin()"> Sandbox mode (simulated payments and access)</label><b>Payment providers</b>${Object.keys(PV).map(k=>`<label class="ck"><input type="checkbox" ${S.cfg.prov[k]?'checked':''} onchange="upp('${k}',this.checked)"> ${PV[k]}</label>`).join('')}
<label>Hotspot controller<select onchange="upc('ctrl',this.value)">${[['none','Not connected (simulated)'],['mikrotik','MikroTik API'],['radius','RADIUS server'],['voucher','Voucher system']].map(o=>`<option value="${o[0]}" ${S.cfg.ctrl==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></label>
<p class="mu">Going live needs a secure server for provider API keys, webhook verification and the controller or RADIUS link. The simulated functions grant() and settle() mark where those calls belong.</p><button class="btn s x" onclick="if(!S.cfg.__r){S.cfg.__r=1;this.textContent='Click again to erase all demo data'}else{S=D();save();ad=false;route()}">Reset all data</button></div>`;
V(`<section class="w sec"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px"><h1>Admin</h1><button class="btn s o" onclick="ad=false;route()">Sign out</button></div><div class="tabs">${Object.keys(T).map(k=>`<button class="${at==k?'on':''}" onclick="adTab('${k}')">${T[k]}</button>`).join('')}</div>${b}</section>`)}
function rf(r){const t=S.tx.find(x=>x.ref==r);t.refunded=true;const s=S.ses.find(x=>x.ref==r);if(s&&s.end>Date.now())s.end=Date.now();save();admin()}
function mk(r){const t=S.tx.find(x=>x.ref==r);t.status='pending';t.exp=Date.now()+1e4;settle({ref:r,amount:t.pk.price,cur:'TZS',status:'SUCCESS'});admin()}
/* ---------- Shell ---------- */
function foot(){$('#ft').innerHTML=`<div class="w fg"><div><div class="logo">${LG} Kwahakimu WiFi</div><p class="mu">Fast. Affordable. Connected Everywhere.</p></div><div><b>Explore</b><a href="#/packages">Packages</a><a href="#/coverage">Coverage</a><a href="#/help">Help &amp; Support</a></div><div><b>Legal</b><a href="#/legal/terms">Terms and conditions</a><a href="#/legal/privacy">Privacy policy</a><a href="#/legal/refund">Refund policy</a></div><div><b>Contact</b><p class="mu">${contact()}</p>${/^https?:\/\//.test(S.cfg.social)?`<a href="${E(S.cfg.social)}" rel="noopener noreferrer" target="_blank">Social media</a>`:''}<a href="#/admin" class="mu">Staff</a></div></div><p class="w mu" style="margin-top:18px">&copy; ${new Date().getFullYear()} Kwahakimu WiFi. All rights reserved.</p>`}
const sbn=()=>{$('#sbn').hidden=!S.cfg.sandbox};
const R={'':home,packages:pkgs,how,coverage:cov,about,help,portal,account:acct,admin,legal};
function route(){clearInterval(tm);closeM();const[p,a]=location.hash.slice(2).split('/');(R[p]||home)(a);document.body.classList.toggle('pt',p=='portal');
document.querySelectorAll('nav a:not(.btn)').forEach(x=>x.classList.toggle('on',x.getAttribute('href')=='#/'+(p||'')));$('#na').textContent=S.me?'My Account':'Login / My Account';$('#nv').classList.remove('open');window.scrollTo(0,0)}
$('#lg').innerHTML=LG+'Kwahakimu WiFi';$('#bg').onclick=()=>{const o=$('#nv').classList.toggle('open');$('#bg').setAttribute('aria-expanded',o)};
document.addEventListener('keydown',e=>{if(e.key=='Escape')closeM()});$('#ov').addEventListener('click',e=>{if(e.target.id=='ov')closeM()});
addEventListener('hashchange',route);foot();sbn();route();
</script>
</body>
